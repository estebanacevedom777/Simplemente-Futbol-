     <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-image: url("https://images.unsplash.com/photo-1486286701208-1d58e9338013?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
            background-size: cover;       /* La imagen cubre toda la pantalla */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-position: center;  /* Centra la imagen */
            background-attachment: fixed;   /* La imagen se mantiene fija al hacer scroll */
            height: 100vh;   
            border-radius: 15px;    
            box-shadow: 0 0 25px rgba(255, 255, 255, 1);    /* Ocupa toda la altura de la ventana */
        }
    </style>
