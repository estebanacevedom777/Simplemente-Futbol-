<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#06191d">
	<title>Crear cuenta | Simplemente Futbol</title>
	<link rel="stylesheet" href="/css/styles.css">
	<link rel="stylesheet" href="/css/auth.css">
	<script src="/JS/auth.js" defer></script>
</head>

<body class="auth-page">
	<header class="auth-topbar">
		<a class="auth-brand" href="/html/index.html" aria-label="Simplemente Futbol, inicio">
			<span class="brand-mark" aria-hidden="true">SF</span>
			<span>SIMPLEMENTE <strong>FUTBOL</strong></span>
		</a>
		<a class="auth-back" href="/html/index.html"><span aria-hidden="true">←</span> Volver al inicio</a>
	</header>

	<main class="auth-main">
		<section class="auth-panel" aria-labelledby="auth-title">
			<p class="auth-eyebrow">ENTRA AL PARTIDO</p>
			<h1 id="auth-title">Crea tu cuenta</h1>
			<p class="auth-description">Únete a la comunidad de Simplemente Futbol.</p>

			<form class="auth-form" data-auth-form="signup">
				<label for="signup-name">Nombre</label>
				<input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Tu nombre" required>

				<label for="signup-email">Correo electrónico</label>
				<input id="signup-email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com"
					required>

				<label for="signup-password">Contraseña</label>
				<input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8"
					placeholder="Mínimo 8 caracteres" required>

				<label for="signup-confirm">Confirmar contraseña</label>
				<input id="signup-confirm" name="confirm-password" type="password" autocomplete="new-password"
					minlength="8" placeholder="Repite tu contraseña" required>

				<p class="auth-status" data-auth-status aria-live="polite"></p>
				<button class="auth-submit" type="submit">Crear cuenta <span aria-hidden="true">→</span></button>
			</form>

			<p class="auth-switch">¿Ya tienes cuenta? <a href="/html/login.html">Iniciar sesión</a></p>
		</section>
	</main>

	<footer class="auth-footer">Simplemente Futbol <span>·</span> Pasión por el juego</footer>
</body>

</html>
