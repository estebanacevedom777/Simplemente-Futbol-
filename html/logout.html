<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06191d">
    <title>Cerrar sesión | Simplemente Futbol</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-page">
    <header class="auth-topbar">
        <a class="auth-brand" href="/html/index.html" aria-label="Simplemente Futbol, inicio">
            <span class="brand-mark" aria-hidden="true">SF</span>
            <span>SIMPLEMENTE <strong>FUTBOL</strong></span>
        </a>
        <a class="auth-back" href="/html/index.html"><span aria-hidden="true">←</span> Volver al inicio</a>
    </header>

    <main class="auth-main">
        <section class="auth-panel logout-panel" aria-labelledby="logout-title">
            <p class="auth-eyebrow">HASTA EL PRÓXIMO PARTIDO</p>
            <h1 id="logout-title">¿Quieres salir?</h1>
            <p class="auth-description">Puedes volver cuando quieras para seguir disfrutando de Simplemente Futbol.</p>
            <div class="logout-actions">
                <a class="auth-submit" href="/html/index.html">Cerrar sesión <span aria-hidden="true">→</span></a>
                <a class="logout-cancel" href="/html/index.html">Seguir en el sitio</a>
            </div>
        </section>
    </main>

    <footer class="auth-footer">Simplemente Futbol <span>·</span> Pasión por el juego</footer>
</body>

</html>
