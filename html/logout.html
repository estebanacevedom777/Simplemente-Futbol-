<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06191d">
    <title>Cerrar sesión | Simplemente Futbol</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/JS/api.js" defer></script>
    <script src="/JS/auth.js" defer></script>
</head>

<body class="auth-page">
    <header class="auth-topbar">
        <a class="auth-brand" href="/html/index.html" aria-label="Simplemente Futbol, inicio">
            <span class="brand-mark" aria-hidden="true">SF</span>
            <span>SIMPLEMENTE <strong>FUTBOL</strong></span>
        </a>
        <a class="auth-back" href="/html/index.html"><span aria-hidden="true">←</span> Volver al inicio</a>
    </header>

    <main class="auth-main">
        <section class="auth-panel logout-panel" aria-labelledby="logout-title">
            <p class="auth-eyebrow">HASTA EL PRÓXIMO PARTIDO</p>
            <h1 id="logout-title">¿Quieres salir?</h1>
            <p class="auth-description" id="logout-description">Comprobando la sesión del servidor...</p>
            <p class="auth-status" id="logout-status" aria-live="polite"></p>
            <div class="logout-actions" id="logout-actions">
                <button class="auth-submit" id="confirm-logout" type="button">Cerrar sesión <span aria-hidden="true">→</span></button>
                <a class="logout-cancel" href="/html/index.html">Cancelar y volver al inicio</a>
            </div>
            <a class="logout-home-link" id="logout-home-link" href="/html/index.html" hidden>Volver al inicio</a>
            <p class="auth-demo-note">La sesión se administra desde el servidor local y se cierra al confirmar.</p>
        </section>
    </main>

    <footer class="auth-footer">Simplemente Futbol <span>·</span> Pasión por el juego</footer>
</body>

</html>
